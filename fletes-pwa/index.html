<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>IosFletes — Terminal Logística & Hacienda</title>
  <meta name="description" content="Sistema de Gestión Logística, Fletes Ganaderos y Hacienda — Frigorífico Pampa" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IosFletes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/png" href="/fletes/app-icon.png" />
  <link rel="apple-touch-icon" href="/fletes/app-icon.png" />
  <link rel="manifest" href="/fletes/manifest.json" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/fletes/sw.js', { scope: '/fletes/' })
          .catch((err) => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
