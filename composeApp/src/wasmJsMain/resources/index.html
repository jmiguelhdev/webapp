        // Polyfill para crypto.randomUUID en contextos no seguros (HTTP)
        if (!window.crypto.randomUUID) {
            window.crypto.randomUUID = function() {
                return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
                    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
                );
            };
        }

    <!-- Helper para Firebase Auth en Wasm -->
    <script type="module">
        import { GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
        window.createGoogleAuthProvider = () => new GoogleAuthProvider();
        window.firebaseSignInWithPopup = (auth, provider) => {
            console.log('[DEBUG_AUTH] Ejecutando signInWithPopup desde el helper JS...');
            return signInWithPopup(auth, provider).catch(err => {
                console.error('[DEBUG_AUTH] Error en el helper JS:', err);
                throw err;
            });
        };
    </script>
